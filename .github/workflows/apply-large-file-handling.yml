name: Apply large-file handling

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch bot.py
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("bot.py")
          text = path.read_text(encoding="utf-8")
          start = text.index("async def handle_telegram_file")
          end = text.index("\n\napp_flask = Flask(__name__)", start)

          new_function = '''async def handle_telegram_file(update, context, file_obj):
    MAX_TELEGRAM_DOWNLOAD_BYTES = 20 * 1024 * 1024
    file_size = getattr(file_obj, "file_size", None) or 0
    if file_size > MAX_TELEGRAM_DOWNLOAD_BYTES:
        keyboard = InlineKeyboardMarkup([
            [InlineKeyboardButton("🔗 تحويل الملف إلى رابط", url="https://t.me/File2url_rbot")]
        ])
        await update.message.reply_text(
            "📦 *الملف كبير جدًا*\\n\\n"
            f"💾 الحجم: {human_size(file_size)}\\n"
            "⚠️ Telegram لا يسمح للبوت بتنزيل الملفات الأكبر من 20MB مباشرة.\\n\\n"
            "حوّل الملف إلى رابط عبر الزر أدناه، ثم أرسل الرابط إلى DriveSaverBot وسأحفظه في Google Drive.",
            parse_mode="Markdown",
            reply_markup=keyboard,
        )
        return

    msg = await update.message.reply_text("📥 جارٍ التنزيل من تلجرام...")
    start = time.time()
    try:
        tg = await context.bot.get_file(file_obj.file_id)
        name = file_obj.file_name or f"tg_{file_obj.file_unique_id}"
        with tempfile.TemporaryDirectory() as tmp:
            path = os.path.join(tmp, name)
            await tg.download_to_drive(path)
            size = os.path.getsize(path)
            await msg.edit_text(f"📤 جارٍ الرفع... ({human_size(size)})")
            result = await asyncio.to_thread(upload_to_drive, path)
            await msg.edit_text(
                f"✅ *تم الحفظ في Drive!*\\n\\n"
                f"📁 [{result['name']}]({result['link']})\\n"
                f"💾 {human_size(size)}\\n"
                f"⏱️ {human_time(time.time() - start)}",
                parse_mode="Markdown",
                disable_web_page_preview=True,
            )
    except Exception as e:
        logger.error(f"Error: {e}", exc_info=True)
        await msg.edit_text(f"❌ فشل:\\n`{str(e)[:300]}`", parse_mode="Markdown")
'''

          path.write_text(text[:start] + new_function + text[end:], encoding="utf-8")
          PY

      - name: Validate and commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m py_compile bot.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          git rm .github/workflows/apply-large-file-handling.yml
          git commit -m "Handle Telegram files over 20MB with File2URL button"
          git push