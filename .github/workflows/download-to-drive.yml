name: Download to Google Drive

on:
  workflow_dispatch:
    inputs:
      url:
        description: Direct public download URL (login-protected pages may not work)
        required: true
        type: string
      filename:
        description: Optional output filename
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: github-drive-download
  cancel-in-progress: false

jobs:
  transfer:
    name: Download, extract, and upload
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out transfer code
        uses: actions/checkout@v4

      - name: Install archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full unrar-free

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check "google-api-python-client>=2.120,<3" "google-auth>=2.28,<3" "requests>=2.31,<3"

      - name: Transfer file to Google Drive
        env:
          SOURCE_URL: ${{ inputs.url }}
          OUTPUT_FILENAME: ${{ inputs.filename }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python tools/github_download/transfer.py
